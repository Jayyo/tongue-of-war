name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - run: npm test
      # The page is static apart from the LLM proxy in server.js. Publish the page,
      # its art and the two three.js files the import map points at, and mark the
      # build so the opponent is the scripted bot from the start.
      - name: Collect site files
        run: |
          mkdir -p _site/node_modules/three/build
          cp -r index.html src assets LICENSE NOTICE _site/
          cp node_modules/three/build/three.module.js node_modules/three/build/three.core.js _site/node_modules/three/build/
          cp node_modules/three/LICENSE _site/node_modules/three/
          sed -i 's#<meta charset="utf-8" />#&\n<meta name="backend" content="none" />#' _site/index.html
          grep -q '<meta name="backend" content="none" />' _site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
